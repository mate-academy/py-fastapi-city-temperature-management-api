[project]
name = "py-fastapi-city-temperature-management-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yan", email = "marynetsyy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "black>=26.10.1",
    "fastapi[standart]>=0.162.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "uliweb-alembic>=0.6.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
py-fastapi-city-temperature-management-api = "py_fastapi_city_temperature_management_api:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.black]
line-length = 79
