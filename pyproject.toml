[project]
name = "city-temp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artem D", email = "OkeNNV@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
