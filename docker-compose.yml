services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/city_temperature_db.db
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
volumes:
  sqlite_data:
